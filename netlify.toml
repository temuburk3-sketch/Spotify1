[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/spotify/resolve"
  to = "/.netlify/functions/spotify-resolve"
  status = 200

[[redirects]]
  from = "/api/spotify/search"
  to = "/.netlify/functions/spotify-search"
  status = 200

[[redirects]]
  from = "/api/radio/track"
  to = "/.netlify/functions/radio-track"
  status = 200

[[redirects]]
  from = "/api/audio/full-source"
  to = "/.netlify/functions/full-source"
  status = 200

[[redirects]]
  from = "/api/audio/full-stream"
  to = "/.netlify/functions/full-source"
  status = 200

[[redirects]]
  from = "/api/audio/match"
  to = "/.netlify/functions/full-source"
  status = 200

[[redirects]]
  from = "/api/spotify/charts"
  to = "/.netlify/functions/spotify-search"
  status = 200

[[redirects]]
  from = "/api/playlist/tracks"
  to = "/.netlify/functions/spotify-resolve"
  status = 200

[[redirects]]
  from = "/api/lyrics"
  to = "/.netlify/functions/lyrics"
  status = 200

[[redirects]]
  from = "/api/gemini/lyrics"
  to = "/.netlify/functions/lyrics"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
